<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Student | Student Management</title>
    <link rel="icon" type="image/svg+xml"
          href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}" />
  </head>
  <body>
    {% include "_flash.html" %}
    <form method="post">
      <h2>Edit Student</h2>
      <input name="name" value="{{ student['name'] }}" required>
      <input type="email" name="email" value="{{ student['email'] }}" required>
      <input name="course" value="{{ student['course'] }}" required>
      <button type="submit">Update</button>
    </form>
    <a href="{{ url_for('students') }}">Back</a>
  </body>
</html>
